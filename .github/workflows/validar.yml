name: Validar integração
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_public.py
      - run: python3 tests/test_install.py
      - run: python3 tests/test_audit_additions.py
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-xlib
      - run: /usr/bin/python3 tests/test_runtime.py
      - run: bash -n escolher-cor-pastas.sh folders-color-chooser.sh
