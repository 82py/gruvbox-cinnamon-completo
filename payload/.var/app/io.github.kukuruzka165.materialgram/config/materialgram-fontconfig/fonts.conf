<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Mantém toda a configuração normal do runtime Flatpak. -->
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>

  <!-- Exclui apenas webfonts problemáticas. -->
  <selectfont>
    <rejectfont>
      <glob>*.woff</glob>
      <glob>*.woff2</glob>
    </rejectfont>
  </selectfont>

  <!-- Cache exclusivo desta configuração. -->
  <cachedir prefix="xdg">materialgram-fontconfig</cachedir>

</fontconfig>
